services:
  ai-service:
    build: .
    image: rentsaathi-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AI_MODE: ${AI_MODE:-auto}
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      REPORTS_DIR: /app/reports
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
